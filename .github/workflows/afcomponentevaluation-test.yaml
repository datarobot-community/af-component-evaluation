---
name: af-component-evaluation
on:
  push:
    branches: ["main"]
    paths:
      - "template/**"
      - "copier.yml"
      - "Taskfile.yml"
      - ".github/workflows/afcomponentevaluation-test.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "template/**"
      - "copier.yml"
      - "Taskfile.yml"
      - ".github/workflows/afcomponentevaluation-test.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: "Test (python${{ matrix.python }})"
    runs-on: "ubuntu-latest"
    container:
      image: ghcr.io/astral-sh/uv:python${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"
      # CI tests the COPIED (rendered) instance — i.e. what a user actually gets —
      # rather than the source `template/` tree. Local development still runs
      # directly against `template/[[ evaluation_app_name ]]/` via the root
      # Taskfile (no render needed); see copier.yml for the rationale.
      - name: Render copier instance
        shell: sh
        run: |
          apt-get update && apt-get install -y --no-install-recommends git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uvx copier copy --vcs-ref=HEAD --defaults . ./.rendered
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Install dependencies
        shell: sh
        working-directory: ./.rendered/evaluations
        run: uvx --from go-task-bin task install
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: License header check
        if: matrix.python == '3.11'
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0
        with:
          config: .github/.licenserc.yaml
          # `.licenserc.yaml` sets `comment: on-failure`, which needs
          # `pull-requests: write`. This job renders and runs PR-authored code, so
          # it deliberately stays read-only. Empty token disables PR commenting;
          # the step still fails and logs the offending files.
          token: ""
      - name: Lint check
        shell: sh
        working-directory: ./.rendered/evaluations
        run: uvx --from go-task-bin task lint-check
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Run tests with coverage
        shell: sh
        working-directory: ./.rendered/evaluations
        run: uvx --from go-task-bin task test-coverage
        env:
          UV_CACHE_DIR: /.uv_cache
