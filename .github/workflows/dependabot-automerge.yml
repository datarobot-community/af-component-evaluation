---
# Turns on GitHub's native auto-merge for Dependabot pull requests.
#
# This does NOT bypass branch protection. Auto-merge only queues the PR; GitHub
# squash-merges it once every protection rule on `main` is satisfied, which for
# this repo means the three required `Test (python3.x)` checks are green AND a
# @datarobot-community/buzok code owner has approved. The win is that nobody has
# to come back and click merge after CI finishes.
#
# Scoped to the github-actions ecosystem on purpose. Real dependencies are
# managed by cve-sync, not Dependabot, and this guard means that if a `pip`
# entry is ever added back to dependabot.yml it will not silently auto-merge.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: "Enable auto-merge"
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge
        if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
