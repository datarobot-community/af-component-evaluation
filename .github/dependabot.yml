---
# This file configures Dependabot for the repository.
#
# Only the github-actions ecosystem is enabled. The Python ecosystem is
# deliberately omitted: this is a copier template, so the dependency manifests
# live under a jinja-templated path (`template/[[ evaluation_app_name ]]/`) that
# Dependabot cannot resolve, and enabling it produces PRs that have to be closed
# and fixed by hand. Python dependencies are bumped as part of normal
# datarobot-genai version bumps instead.
version: 2
updates:
  # Maintain dependencies for GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Everything lands in ONE pull request. Without a group, Dependabot opens a
    # separate PR per action, which for this repo means up to eight PRs for a
    # single `datarobot-oss/github-actions` release. The wildcard pattern plus
    # all three update-types keeps majors in that same PR instead of splitting
    # them out on their own.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
    open-pull-requests-limit: 1
    # `automerge` opts these PRs into unattended approve-and-merge; see
    # .github/automerge.yaml for what has to be green first.
    #
    # EVERY label here must already exist in the repo. Dependabot silently drops
    # a label it cannot find — no warning, no label on the PR, and automerge
    # then finds no candidates and does nothing, forever, with nothing saying
    # why. Run workflow-ensure-labels.yaml before touching this list.
    labels:
      - "dependencies"
      - "github-actions"
      - "automerge"
    commit-message:
      prefix: "ci"
