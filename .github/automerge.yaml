# ─────────────────────────────────────────────────────────────────────────────
# Automerge policy for dr-auto-merge.
#
# The presence of this file enrols the repo; delete it and automerge stops, with
# no workflow edit. It is always read from the DEFAULT BRANCH, so a pull request
# cannot ship a policy that grants itself permission to be merged.
#
# The ruleset is the enforcer, this file is an EXTRA gate on top of it. `main`
# carries required_status_checks with an empty bypass list, so nothing here can
# cause a failing PR to merge.
#
# Reference: docs/AUTOMERGE.md in datarobot-oss/github-actions.
# Wiring cve-sync into this file: the enroll-automerge skill in cve-sync.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# Spelled with the `[bot]` suffix, exactly. Authors are compared with no
# normalization, and a mismatch is SILENT: the PR is not a candidate at all, so
# it gets no comment and no hand-over.
#
# Dependabot enrolled 2026-09-11, cve-sync[bot] 2026-09-16, one at a time so a
# surprise has an obvious source.
#
# cve-sync decides for itself whether a resync is boring enough to carry the
# `automerge` label at all, reading the uv.lock diff to do it: a major version
# crossing, a package entering or leaving the resolution, or a removed ceiling
# all get `00 - Ready for Review` instead. That is upstream of this policy, not
# a substitute for it.
allowed_authors:
  - dependabot[bot]
  - cve-sync[bot]

label: automerge

# Each context must be PRESENT and green. Not "not failing": present. A PR where
# a suite never ran at all is refused.
#
# Contexts the rulesets already require are added automatically from the branch
# rules API. The three `Test` legs and `gate / cve-sync gate` are repeated
# anyway, deliberately: if someone edits the ruleset and drops one, this file
# still holds the line.
#
# `Changelog / Changelog updated` is not required by the ruleset and is always
# skipped on a bot PR (`skip_bot_authors: true`), so listing it asserts one
# thing only: that the workflow was dispatched at all. Given how often GitHub
# silently fails to dispatch a run, that is worth asserting.
#
# One list, both authors. There is no per-author scoping, so a context has to be
# one that BOTH bots' PRs fire, which is what keeps the smoke test off it.
#
# Deliberately absent: `Integration smoke test` (eval-smoke.yml is path-filtered
# to `template/**` with no always-reporting gate job, so a cve-sync PR fires it
# but a Dependabot PR never does, and listing it would wedge every Dependabot PR
# forever; `block_on_any_failure` still refuses a red smoke test, what is
# unguarded is it silently never being dispatched), `version`
# (workflow-create-release-from-pyproject.yaml runs on push to main, not
# pull_request), `backport` (closed PRs).
expected_checks:
  - "Test (python3.11)"
  - "Test (python3.12)"
  - "Test (python3.13)"
  - "gate / cve-sync gate"
  - "Changelog / Changelog updated"

# Refuse when ANY check is failing, including ones neither required nor listed.
# `skipped` and `neutral` count as a pass.
block_on_any_failure: true

# Cursor Bugbot reports through a review comment rather than a check, so without
# this flag its findings are decorative: a PR can carry a high-severity finding
# and still merge itself with everything green. Bugbot was the only thing that
# noticed af-component-agent#692 letting generated agents resolve MCP 2.x
# against adapters written for 1.x, on a PR where every check passed. Only OPEN
# threads block; resolving the conversation, or changing the code so the thread
# goes outdated, clears it.
block_on_cursor_comments: true

# Quiet time required after the last check completes, measured from the check
# timestamps. Its real job is catching a workflow that has not reported yet.
settle_seconds: 300

# Sized for the larger of the two bots, which is Dependabot: a grouped
# github-actions bump touches one file per workflow, and nine workflows plus the
# changelog leaves room. A cve-sync resync here is six files at most.
max_changed_files: 15

# The union of what both bots touch. dr-auto-merge has no per-author path rules,
# so anything either bot needs is allowed for both, and the union is still
# narrow enough that a PR carrying a source change is refused.
#
# cve-sync's half is everything but the first two: the root manifest and lock,
# the changelog it stamps because `stamps-release: true`, and the template's
# jinja manifest plus the lock artifact rebuilt from it by
# `regenerate-task: install`. The template entries are spelled file-by-file
# rather than as `template/**` on purpose: a resync has no business editing
# template source, and if one ever does, this hands the PR to a person.
# `.taskfiles/cve-sync.yml` is the vendored command file the resync rewrites
# from the upstream definition; it usually does not move, and when it does the
# PR should not escalate over it.
#
# Dependabot's half is the `.github/` entries. It is scoped to the
# github-actions ecosystem with `directory: "/"`, so it stays in
# `.github/workflows/`.
allowed_paths:
  - ".github/workflows/**"
  - ".github/dependabot.yml"
  - ".taskfiles/cve-sync.yml"
  - "CHANGELOG.md"
  - "pyproject.toml"
  - "uv.lock"
  - "template/**/pyproject.toml.jinja"
  - "template/**/uv.lock"

# `main review` allows squash only; any other method is refused by GitHub.
merge_method: squash

# Terminal refusals (a failed check, a file outside `allowed_paths`, an open
# Bugbot thread) drop the `automerge` label, apply this one, and post a NEW
# comment saying why. Transient ones (checks running, settling, branch behind
# base) just wait for the next poll. Dropping `automerge` first is what makes
# the hand-over happen exactly once.
#
# `00 - Ready for Review` puts the PR in the normal review queue. The label is
# applied with the App token rather than GITHUB_TOKEN, so it also triggers
# workflow-pr-automation.yaml's Slack ping.
#
# cve-sync applies this same label itself, before anything has run, when it
# decides a change is not one a green check run settles. Same destination, two
# routes, and a reviewer can tell which by where the reason is: in the PR body
# means cve-sync refused up front, in a comment means dr-auto-merge gave up
# after the fact.
escalate_label: "00 - Ready for Review"
