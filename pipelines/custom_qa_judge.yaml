# NeMo Evaluator pipeline: custom Q&A dataset with LLM-as-judge scoring.
#
# USER CONFIGURATION — the only things you should need to change:
#
#   judge.model  — LiteLLM model name for the judge LLM.
#                  Uses the same model name format as NAT.
#                  Examples:
#                    openai/gpt-4o-mini
#                    anthropic/claude-haiku-4-5-20251001
#                    nvidia_nim/meta/llama-3.1-70b-instruct
#                    azure/gpt-4o
#
#   judge.api_key — name of the env var holding the judge's API key.
#                   The correct key for your chosen model will already be
#                   present in the environment at execution time.
#
# Values in ${...} are injected at runtime by run_eval.py — do not change those.
#
# Docs: https://docs.nvidia.com/nemo/evaluator/latest/

defaults:
  - execution: local
  - deployment: none
  - _self_

execution:
  output_dir: "${OUTPUT_DIR}"

target:
  api_endpoint:
    model_id: "${AGENT_MODEL_NAME}"
    url: "${AGENT_ENDPOINT_URL}"
    api_key_name: AGENT_API_KEY

evaluation:
  nemo_evaluator_config:
    config:
      params:
        parallelism: "${MAX_CONCURRENCY}"
        request_timeout: 120

  tasks:
    - name: custom_qa
      nemo_evaluator_config:
        config:
          params:
            extra:
              custom_dataset:
                path: "${DATASET_PATH}"
                format: openai

              generate_report: true

              judge:
                # Set api_key to the env var name whose value is the API key
                # for your chosen model. The correct key will be in the
                # environment at execution time.
                api_key: OPENAI_API_KEY                  # env var name — change to match your model
                model: "openai/gpt-4o-mini"              # LiteLLM model name — change to your preferred judge
                url: "${LITELLM_PROXY_URL}"              # injected from environment at runtime
                temperature: 0.0
                top_p: 0.0001
                max_tokens: 512
                timeout: 120
                max_retries: 3
