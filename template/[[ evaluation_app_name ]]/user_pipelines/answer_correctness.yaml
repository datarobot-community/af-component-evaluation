---
# Answer Correctness — deterministic match against a known answer (judge-free).
#
# Default pipeline for regression testing. Compares the response to each case's
# `ideal_response` via match_mode (exact | normalized | contains). No judge model
# is needed, so this runs with no judge credentials and is fully reproducible.
#
# Benchmark: evaluator/benchmarks/answer_correctness.py
# Dataset cases need `ideal_response` (and optional `match_mode`).
benchmark:
  module: evaluator/benchmarks/answer_correctness.py
  name: answer_correctness
target:
  model_type: chat
  model_id: unknown
  api_key_name: AGENT_API_KEY
run:
  parallelism: 4
  max_tokens: 1024
  temperature: 0.0
  timeout_per_sample: 180
