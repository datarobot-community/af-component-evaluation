---
# EXAMPLE PIPELINE (judge-based) — pairs with user_example_benchmark_judge_based.py
#
# Copy this file, rename it (e.g. my_tone_check.yaml), and update:
#   benchmark.module  → path to your benchmark .py (relative to the component root)
#   benchmark.name    → must match the name= argument in @benchmark(...)
#   judge.*           → your judge endpoint, model, and auth env var
#
# The judge: block is what distinguishes a judge-based pipeline.  run.py reads it
# and exports JUDGE_URL, JUDGE_MODEL_ID, and JUDGE_API_KEY_NAME into the subprocess
# environment before the NeMo runner starts.  Your benchmark module reads those vars
# from os.environ to build its JUDGE dict.
#
# ⚠️  Bedrock/Claude models cannot be the stock judge — NeMo's judge client sends
#     both temperature and top_p, which DR-gateway Bedrock models reject.
#     Use an Azure OpenAI model.  See BUGS.md  # 1.
#
# Run it:
#   task eval -- --endpoint http://localhost:8842/v1 \
#     --pipeline user_pipelines/user_example_pipeline_judge_based.yaml \
#     --dataset user_datasets/your_cases.json
benchmark:
  module: user_pipelines/user_example_benchmark_judge_based.py  # path relative to component root
  name: custom_criteria  # must match name= in @benchmark(...)
target:
  model_type: chat
  model_id: unknown  # "unknown" → agent uses its own configured default LLM
  api_key_name: AGENT_API_KEY  # env var NAME holding the agent token (set only if needed)
judge:
  # OpenAI-compatible base URL; NeMo appends /chat/completions internally.
  url: https://app.datarobot.com/api/v2/genai/llmgw
  # Gateway CATALOG name — NOT a litellm datarobot/ prefix.
  # List available models: GET .../api/v2/genai/llmgw/models
  model_id: azure/gpt-4o-2024-11-20
  # env var NAME (not the token value) holding the judge bearer token.
  api_key_name: DATAROBOT_API_TOKEN
run:
  parallelism: 4
  max_tokens: 1024
  temperature: 0.0
  timeout_per_sample: 180
