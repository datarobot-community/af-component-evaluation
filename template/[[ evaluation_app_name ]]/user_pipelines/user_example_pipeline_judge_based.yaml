---
# EXAMPLE PIPELINE (judge-based) — pairs with user_example_benchmark_judge_based.py
# Copy, rename, point benchmark.module/name at your benchmark, and set the judge: block.
# run.py exports JUDGE_URL/JUDGE_MODEL_ID/JUDGE_API_KEY_NAME from it for the scorer.
# Any model in your gateway can be the judge; it scores deterministically (temperature 0).
# Full guide: docs/evaluation/writing-benchmarks.md and docs/evaluation/troubleshooting.md
benchmark:
  module: user_pipelines/user_example_benchmark_judge_based.py  # path relative to component root
  name: custom_criteria  # must match name= in @benchmark(...)
target:
  model_type: chat
  model_id: unknown  # "unknown" → agent uses its own configured default LLM
  api_key_name: AGENT_API_KEY  # env var NAME holding the agent token (set only if needed)
judge:
  # OpenAI-compatible base URL; NeMo appends /chat/completions internally.
  url: https://app.datarobot.com/api/v2/genai/llmgw
  # Gateway CATALOG name — NOT a litellm datarobot/ prefix.
  # List available models: GET .../api/v2/genai/llmgw/models
  model_id: azure/gpt-5-5-2026-04-23
  # env var NAME (not the token value) holding the judge bearer token.
  api_key_name: DATAROBOT_API_TOKEN
run:
  parallelism: 4
  max_tokens: 1024
  temperature: 0.0
  timeout_per_sample: 180
