[project]
name = "af-component-evaluation"
version = "0.1.0"
description = "Batch evaluation framework for DataRobot agents using NeMo Evaluator"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "nemo-evaluator-launcher",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.0",
    "yamlfix>=1.17.0",
]

[project.scripts]
run-eval = "run:main"
generate-cases = "generate:main"
summarize = "summarize:main"

# -----------------------------------------------------------------------
# af-component marker — detected by the core CLI to discover this
# evaluation component without importing it or activating its environment.
#
# Detection pattern (core CLI):
#
#   import tomllib, pathlib
#   for pyproject in pathlib.Path(".").rglob("pyproject.toml"):
#       data = tomllib.loads(pyproject.read_text())
#       meta = data.get("tool", {}).get("af-component", {})
#       if meta.get("type") == "evaluation":
#           entrypoint = pyproject.parent / meta["entrypoint"]
#           # invoke: uv run --project <pyproject.parent> python <entrypoint> --endpoint ...
# -----------------------------------------------------------------------
[tool.af-component]
type = "evaluation"
entrypoint = "run.py"
version = "1"
pipelines_dir = "pipelines"
datasets_dir = "user_datasets"
output_status = "output/eval_status.json"
output_results = "output/eval_results.json"

[tool.uv]
required-version = ">=0.7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["PLC0415"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.yamlfix]
allow_duplicate_keys = true
line_length = 120

[tool.mypy]
strict = true
python_version = "3.11"
exclude = """(?x)(
    output/
    | .venv/
    | venv/
    | build/
    | dist/
    | tests/
  )"""
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
disable_error_code = ["typeddict-unknown-key"]
enable_error_code = "ignore-without-code"
implicit_reexport = true
ignore_missing_imports = true
no_implicit_optional = true
show_column_numbers = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
