# Example run config — for documentation purposes only.
# The external CLI passes these as flags directly to run_eval.py; this file
# shows what those flags correspond to.
#
# Usage:
#   python run_eval.py \
#     --endpoint  http://localhost:8080/v1 \
#     --pipeline  custom_qa_judge.yaml \
#     --dataset   datasets/sample_cases.json
#
# Required env vars:
#   AGENT_API_KEY      — API key for the agent endpoint
#   AGENT_MODEL_NAME   — model name the agent endpoint expects
#   JUDGE_API_KEY      — API key for the judge LLM (judge model/URL are set in the pipeline YAML)
#
# Optional env vars:
#   MAX_CONCURRENCY    — parallel requests to agent (default: 4)

# Pipeline YAML (in pipelines/) defines the full evaluation workflow including
# which judge LLM to use, scoring criteria, and NeMo task configuration.
# Edit the pipeline YAML directly to change judge model or evaluation settings.
pipeline: custom_qa_judge.yaml

# The agent endpoint to evaluate
agent_endpoint: "http://localhost:8080/v1"

# Dataset of test cases (see datasets/schema.md)
dataset: datasets/sample_cases.json
