---
# https://taskfile.dev
#
# DEVELOPMENT-ONLY root Taskfile. This file lives OUTSIDE `template/`, so copier
# never ships it — in a rendered project the root Taskfile is generated by
# `dr task compose`. Its only job here is to let a developer run the evaluation
# component's tasks directly against the SOURCE folder (no `.rendered/` step),
# while inheriting the root `.env`.
#
# This works because the component folder is `template/[[ evaluation_app_name ]]/`
# (bracket delimiters), which contains no `{{ }}` for go-task to choke on. See
# copier.yml for the full rationale.
version: '3'

dotenv: ['.env']

includes:
  eval:
    taskfile: './template/[[ evaluation_app_name ]]/Taskfile.yml'
    dir: './template/[[ evaluation_app_name ]]'

tasks:
  default:
    desc: ℹ️ List available tasks
    cmds: [task --list]
    silent: true
  install:
    desc: 🛠️ Install evaluation component dependencies
    cmds: [{task: eval:install}]
  lint:
    desc: 🧹 Run linters
    cmds: [{task: eval:lint}]
  lint-check:
    desc: 🧹 Check linting without fixing
    cmds: [{task: eval:lint-check}]
  test:
    desc: 🧪 Run tests
    cmds: [{task: eval:test}]
  test-coverage:
    desc: 🧪 Run tests with coverage report
    cmds: [{task: eval:test-coverage}]
  render:
    desc: 🏗️ Render this component to ./.rendered to inspect the copied output (pass copier args with --, e.g. `task render -- --defaults`)
    cmds:
      - rm -rf .rendered
      - 'uvx copier copy --vcs-ref=HEAD . .rendered {{.CLI_ARGS}}'
      - echo "✅ Rendered to ./.rendered (renders committed state; commit changes first to see them)"
    silent: true
