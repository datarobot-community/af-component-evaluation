---
# https://taskfile.dev
#
# DEVELOPMENT-ONLY root Taskfile. This file lives OUTSIDE `template/`, so copier
# never ships it — in a rendered project the root Taskfile is generated by
# `dr task compose`. Its only job here is to let a developer run the evaluation
# component's tasks directly against the SOURCE folder (no `.rendered/` step),
# while inheriting the root `.env`.
#
# This works because the component folder is `template/[[ evaluation_app_name ]]/`
# (bracket delimiters), which contains no `{{ }}` for go-task to choke on. See
# copier.yml for the full rationale.
version: '3'

dotenv: ['.env']

includes:
  # Vendored from datarobot-oss/cve-sync (taskfiles/cve-sync.yml). Only the
  # taskfile is vendored; the tool and the CVE policy are fetched at run time, so
  # this file does not need updating when a floor changes. Not flattened, so the
  # tasks are namespaced as `task cve-sync:<name>`.
  #
  # `task cve-sync:check-templates` is the one that matters most here. What ships
  # to a customer is rendered from pyproject.toml.jinja plus the committed
  # uv.lock beside it, and the plain `check` task cannot see either on a fresh
  # clone: template/*/pyproject.toml is generated by `task install` and
  # gitignored, so root discovery finds only the near-empty repo root in CI.
  cve-sync:
    taskfile: .taskfiles/cve-sync.yml

  eval:
    taskfile: './template/[[ evaluation_app_name ]]/Taskfile.yml'
    dir: './template/[[ evaluation_app_name ]]'

tasks:
  default:
    desc: ℹ️ List available tasks
    cmds: [task --list]
    silent: true
  install:
    desc: 🛠️ Install evaluation component dependencies
    cmds:
      - uv sync
      - task: _render-pyproject
      - task: eval:install
  _render-pyproject:
    internal: true
    cmds:
      - |
        uv run python - <<'PYEOF'
        import jinja2, pathlib
        env = jinja2.Environment(
            loader=jinja2.FileSystemLoader('.'),
            variable_start_string='[[',
            variable_end_string=']]',
            block_start_string='[%',
            block_end_string='%]',
            comment_start_string='[#',
            comment_end_string='#]',
            keep_trailing_newline=True,
        )
        t = env.get_template('template/[[ evaluation_app_name ]]/pyproject.toml.jinja')
        out = pathlib.Path('template/[[ evaluation_app_name ]]/pyproject.toml')
        out.write_text(t.render(evaluation_app_name='evaluations'))
        PYEOF
  lint:
    desc: 🧹 Run linters
    cmds: [{task: eval:lint}]
  lint-check:
    desc: 🧹 Check linting without fixing
    cmds: [{task: eval:lint-check}]
  test:
    desc: 🧪 Run tests
    cmds: [{task: eval:test}]
  test-coverage:
    desc: 🧪 Run tests with coverage report
    cmds: [{task: eval:test-coverage}]
  test-integration:
    desc: 🔬 Run integration smoke tests (requires DATAROBOT_API_TOKEN + DATAROBOT_ENDPOINT in .env)
    cmds: [{task: eval:test-integration}]
  render:
    desc: 🏗️ Render this component to ./.rendered to inspect the copied output (pass copier args with --, e.g. `task render -- --defaults`)
    cmds:
      - rm -rf .rendered
      - 'uvx copier copy --vcs-ref=HEAD . .rendered {{.CLI_ARGS}}'
      - echo "✅ Rendered to ./.rendered (renders committed state; commit changes first to see them)"
    silent: true
