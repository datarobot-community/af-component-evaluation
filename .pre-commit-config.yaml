---
# See https://pre-commit.com for more information.
#
# Install the hooks locally with:
#   uvx pre-commit install
#
# Linting (ruff, mypy) is intentionally not run here. Those tools live in the
# rendered component environment rather than at the repo root, so they run via
# `task lint` and in CI instead.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
